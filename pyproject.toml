[project]
name = "chatbot"
version = "0.1.0"
description = "AI chatbot built with Langchain and Groq"
readme = "README.md"
authors = [
    { name = "Reamogetse Mogotsi", email = "mogotsireamogetse@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.8",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "openai>=3.42.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
